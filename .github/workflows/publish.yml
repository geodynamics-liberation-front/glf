name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # daily, so the site tracks the projects' main branches
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project build dependencies
        run: pip install numpy pyshp
      - name: Cache project checkouts and downloaded datasets
        uses: actions/cache@v4
        with:
          path: build/repos
          key: repos-${{ hashFiles('projects.json') }}-${{ github.run_id }}
          restore-keys: |
            repos-${{ hashFiles('projects.json') }}-
            repos-
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
