name: Publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project build dependencies
        run: pip install numpy pyshp
      - name: Cache project checkouts and downloaded datasets
        uses: actions/cache@v4
        with:
          path: build/repos
          key: repos-${{ hashFiles('projects.json') }}-${{ github.run_id }}
          restore-keys: |
            repos-${{ hashFiles('projects.json') }}-
            repos-
      - name: Build
        run: make dist
      - name: Skip deployment when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Build succeeded. Not deploying, since the CLOUDFLARE_API_TOKEN secret is not set (see README, Deployments from GitHub)."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=glf --branch=main --commit-dirty=true
