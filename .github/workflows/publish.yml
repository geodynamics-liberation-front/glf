name: Publish site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project build dependencies
        run: pip install numpy pyshp
      - name: Cache project checkouts and downloaded datasets
        uses: actions/cache@v4
        with:
          path: build/repos
          key: repos-${{ hashFiles('projects.json') }}-${{ github.run_id }}
          restore-keys: |
            repos-${{ hashFiles('projects.json') }}-
            repos-
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=glf --branch=main --commit-dirty=true
